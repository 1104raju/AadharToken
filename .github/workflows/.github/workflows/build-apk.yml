name: Build Aadhar Token APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q AadharTokenApp_Project.zip -d extracted
          mkdir -p app-project
          cp -r extracted/AadharTokenApp/. app-project/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        working-directory: app-project
        run: chmod +x gradlew

      - name: Build APK
        working-directory: app-project
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AadharToken
          path: app-project/app/build/outputs/apk/debug/app-debug.apk
